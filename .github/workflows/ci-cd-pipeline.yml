name: DevOps CI - Automated Tests & Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest-ml-validation:
    name: pytest ML validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml_pipeline/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml_pipeline/requirements.txt

      - name: Run pytest
        run: pytest ml_pipeline/tests/ -v

  nextjs-build-validation:
    name: Next.js build validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="https://placeholder.supabase.co"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            export NEXT_PUBLIC_SUPABASE_ANON_KEY="public-anon-key-not-required-for-build"
          fi
          if [ -z "$SUPABASE_URL" ]; then
            export SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            export SUPABASE_SERVICE_ROLE_KEY="service-role-not-required-for-build"
          fi
          npm install
          npm run build
